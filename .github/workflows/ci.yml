name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mac
          POSTGRES_PASSWORD: mac_ci
          POSTGRES_DB: mac_compresores_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mac" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mac:mac_ci@localhost:5432/mac_compresores_test?schema=public
      TEST_DATABASE_URL: postgresql://mac:mac_ci@localhost:5432/mac_compresores_test?schema=public
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
