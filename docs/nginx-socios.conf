# Portal de socios en https://maccompresores.app/socios - PROPUESTA (no instalada).
# Sin subdominio, sin DNS nuevo, sin certbot: se agrega al server EXISTENTE de maccompresores.app.
# Archivo en DOS PARTES separadas por la linea "CORTE"; procedimiento en docs/deploy-socios.md.
#   PARTE A -> contexto http{}  : /etc/nginx/conf.d/socios-zones.conf   (conf.d/*.conf ya se incluye en http{})
#   PARTE B -> dentro de server{} 443 de /etc/nginx/sites-enabled/maccompresores, via include.
#
# ==== PARTE A (http{}) ====

# 30 peticiones/min por IP (nginx es el borde: $binary_remote_addr es la IP real del cliente).
limit_req_zone $binary_remote_addr zone=mac_partner_req:10m rate=30r/m;
# Imagenes de precio (/socios/p/<token>): una busqueda trae hasta 20 PNG de golpe; zona propia, mas holgada.
limit_req_zone $binary_remote_addr zone=mac_partner_img:10m rate=120r/m;

# User-agents vacios o de herramientas/bots conocidos (insensible a mayusculas).
map $http_user_agent $mac_partner_bad_ua {
    default                 0;
    ""                      1;
    ~*curl                  1;
    ~*wget                  1;
    ~*python-requests       1;
    ~*scrapy                1;
    ~*httpclient            1;
    ~*go-http-client        1;
    ~*headlesschrome        1;
}

# ==== CORTE ====
# ==== PARTE B (dentro de server{} de maccompresores.app, puerto 443) ====
# IMPORTANTE: NO usar "location ^~ /socios" a secas: tambien atraparia /socios-admin (admin interno)
# y le aplicaria limite y bloqueo de UA. Por eso se separa "= /socios" y "^~ /socios/".
# Se dejan los proxy_set_header iguales a los de "location /" + X-Forwarded-Host.
# add_header en un location reemplaza a los del server: aqui se declaran todos los necesarios.

location = /socios {
    limit_req zone=mac_partner_req burst=10 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;
    client_max_body_size 64k;
    if ($mac_partner_bad_ua) { return 403; }
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_pass http://127.0.0.1:3080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

location ^~ /socios/ {
    limit_req zone=mac_partner_req burst=10 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;
    client_max_body_size 64k;
    if ($mac_partner_bad_ua) { return 403; }
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_pass http://127.0.0.1:3080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# PNG de precios: mas holgado (zona mac_partner_img). Si se prefiere el limite unico de 30 r/m,
# cambiar la zona a mac_partner_req (una busqueda de 20 resultados agotaria el burst y daria 429).
location ^~ /socios/p/ {
    limit_req zone=mac_partner_img burst=40 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;
    client_max_body_size 64k;
    if ($mac_partner_bad_ua) { return 403; }
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_pass http://127.0.0.1:3080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
