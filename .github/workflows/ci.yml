name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://mac:mac_ci@localhost:5432/mac_compresores_test?schema=public
      TEST_DATABASE_URL: postgresql://mac:mac_ci@localhost:5432/mac_compresores_test?schema=public
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # PostgreSQL preinstalado en el runner (sin descargar imágenes de Docker Hub, que limita las descargas).
      - name: PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE USER mac WITH PASSWORD 'mac_ci' CREATEDB;" -c "CREATE DATABASE mac_compresores_test OWNER mac;"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
