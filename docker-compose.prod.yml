services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mac
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mac_compresores
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mac -d mac_compresores"]
      interval: 5s
      retries: 10
  migrate:
    build: { context: ., target: migrator }
    environment:
      DATABASE_URL: postgresql://mac:${POSTGRES_PASSWORD}@db:5432/mac_compresores?schema=public
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_DEMO: ${SEED_DEMO}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
    depends_on: { db: { condition: service_healthy } }
    restart: "no"
  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://mac:${POSTGRES_PASSWORD}@db:5432/mac_compresores?schema=public
      COOKIE_SECURE: ${COOKIE_SECURE}
      APP_URL: ${APP_URL:-https://maccompresores.app}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Mac Compresores}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      CRON_SECRET: ${CRON_SECRET:-}
      SHARE_SECRET: ${SHARE_SECRET:-}
      BANK_INFO: ${BANK_INFO:-}
    ports: ["127.0.0.1:3080:3000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
  # Respaldo diario de la BD en ./backups (03:00 de México; conserva BACKUP_KEEP_DAYS días).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: mac
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: mac_compresores
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes: ["./docker/backup.sh:/backup.sh:ro", "./backups:/backups"]
    depends_on: { db: { condition: service_healthy } }
  # Trabajo diario (07:00 de México): vence cotizaciones, recordatorios, stock bajo mínimo y cobro vencido.
  scheduler:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    entrypoint: ["sh", "/scheduler.sh"]
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    volumes: ["./docker/scheduler.sh:/scheduler.sh:ro"]
    depends_on: { app: { condition: service_started } }
volumes:
  pgdata:
