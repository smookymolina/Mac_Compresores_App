# Uso: docker compose up -d --build   → http://localhost:3080
# Requiere .env con SEED_ADMIN_PASSWORD (y opcionalmente POSTGRES_PASSWORD).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mac_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-mac_compresores}
    ports:
      - "127.0.0.1:5433:5432" # solo desde el propio host (desarrollo/pruebas); nunca expuesto a la red
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mac} -d ${POSTGRES_DB:-mac_compresores}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: { context: ., target: migrator }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mac}:${POSTGRES_PASSWORD:-mac_dev_only}@db:5432/${POSTGRES_DB:-mac_compresores}?schema=public
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Define SEED_ADMIN_PASSWORD en .env}
      SEED_DEMO: ${SEED_DEMO:-1}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mac}:${POSTGRES_PASSWORD:-mac_dev_only}@db:5432/${POSTGRES_DB:-mac_compresores}?schema=public
      # HTTP en red local (pruebas desde móvil). Con HTTPS/proxy en producción: true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Enlaces de los correos y SMTP (recuperación de contraseña).
      APP_URL: ${APP_URL:-http://localhost:3080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Mac Compresores}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      # Secreto del trabajo diario (lo usa el servicio scheduler) y datos bancarios del PDF (líneas separadas por "|").
      CRON_SECRET: ${CRON_SECRET:-}
      BANK_INFO: ${BANK_INFO:-}
    ports:
      - "${APP_PORT:-3080}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Respaldo diario de la BD en ./backups (conserva BACKUP_KEEP_DAYS días). Ver docs/deploy-hostinger.md.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-mac}
      PGPASSWORD: ${POSTGRES_PASSWORD:-mac_dev_only}
      PGDATABASE: ${POSTGRES_DB:-mac_compresores}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db: { condition: service_healthy }

  # Trabajo diario de la app: vence cotizaciones, recuerda vencimientos y avisa stock bajo mínimo.
  scheduler:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    entrypoint: ["sh", "/scheduler.sh"]
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - ./docker/scheduler.sh:/scheduler.sh:ro
    depends_on:
      app: { condition: service_started }

volumes:
  pgdata:
