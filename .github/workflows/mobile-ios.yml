name: Mobile iOS (MAC Campo)

# Solo manual: los runners macOS consumen 10× minutos. Valida siempre con un build de simulador sin firma;
# el IPA firmado (y TestFlight) solo se generan si existen los secretos de Apple.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL HTTPS del ERP (vacío = variable de repo MOBILE_API_URL)"
        required: false
        type: string
      export_method:
        description: "Distribución del IPA (ad-hoc = OTA a UDIDs registrados; app-store = TestFlight/App Store)"
        required: true
        default: ad-hoc
        type: choice
        options: [ad-hoc, app-store]
      build_number:
        description: "CFBundleVersion (vacío = mayor*10000+menor*100+parche). Súbelo para re-enviar la misma versión a TestFlight."
        required: false
        type: string

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      VITE_API_URL: ${{ inputs.api_url || vars.MOBILE_API_URL }}
      EXPORT_METHOD: ${{ inputs.export_method }}
      IOS_BUILD_NUMBER: ${{ inputs.build_number }}
      HAS_SIGNING: ${{ secrets.IOS_CERT_P12_BASE64 != '' && secrets.IOS_CERT_PASSWORD != '' && secrets.IOS_PROVISION_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' }}
      HAS_ASC: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Versión
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - name: Build web
        run: |
          if [ -z "$VITE_API_URL" ]; then echo "::warning::VITE_API_URL vacío (define la variable MOBILE_API_URL o el input api_url)"; fi
          npm run build
      - run: npx cap sync ios
      - name: Versión del proyecto Xcode
        run: node scripts/ios-version.mjs

      - name: Build simulador (sin firma)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-sim" CODE_SIGNING_ALLOWED=NO build | tail -n 50
          exit "${PIPESTATUS[0]}"

      # ---------- Firma (solo con secretos). Llavero temporal; nada se imprime ni queda en disco. ----------
      - name: Instalar certificado y perfil
        if: env.HAS_SIGNING == 'true'
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/mac-campo.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "::add-mask::$KC_PASS"
          echo "$IOS_CERT_P12_BASE64" | base64 -D > "$RUNNER_TEMP/cert.p12"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN" >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          { echo "KEYCHAIN=$KEYCHAIN"; echo "PROFILE_UUID=$UUID"; echo "PROFILE_NAME=$NAME"; } >> "$GITHUB_ENV"

      - name: Archive firmado + exportar IPA
        if: env.HAS_SIGNING == 'true'
        working-directory: mobile/ios/App
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          # Firma manual solo en el target App (las dependencias SPM no admiten perfil). Cambio local del runner, no se versiona.
          perl -0pi -e "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = $IOS_TEAM_ID;\n\t\t\t\tCODE_SIGN_IDENTITY = \"Apple Distribution\";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_UUID\";/g" App.xcodeproj/project.pbxproj
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd-dev" OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" archive | tail -n 50
          test "${PIPESTATUS[0]}" -eq 0
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>mx.com.maccompresores.campo</key><string>${PROFILE_UUID}</string></dict>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          mkdir -p "$RUNNER_TEMP/ipa"
          mv "$RUNNER_TEMP"/export/*.ipa "$RUNNER_TEMP/ipa/mac-campo-${{ steps.ver.outputs.version }}-ios-${EXPORT_METHOD}.ipa"
          shasum -a 256 "$RUNNER_TEMP"/ipa/*.ipa

      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING == 'true'
        with:
          name: mac-campo-${{ steps.ver.outputs.version }}-ios-${{ inputs.export_method }}
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error

      - name: Subir a TestFlight
        if: env.HAS_SIGNING == 'true' && env.HAS_ASC == 'true' && inputs.export_method == 'app-store'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # altool busca la llave en ~/.appstoreconnect/private_keys/AuthKey_<ID>.p8
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8_BASE64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app --type ios -f "$RUNNER_TEMP"/ipa/*.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Limpiar llavero y perfil
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          if [ -n "${PROFILE_UUID:-}" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"; fi
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/App.xcarchive" "$RUNNER_TEMP/export" "$RUNNER_TEMP/ExportOptions.plist"
